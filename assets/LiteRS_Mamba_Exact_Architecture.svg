<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f7f1ff"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2f69"/><stop offset="1" stop-color="#163d87"/></linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e1f4ff"/><stop offset="1" stop-color="#c6e5ff"/></linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf0ff"/><stop offset="1" stop-color="#d7e0ff"/></linearGradient>
    <linearGradient id="fusion" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4cc"/><stop offset="1" stop-color="#ffe4a8"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#16335c" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#172b4d"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/></marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-weight: 800; fill:#0b2b63; }
      .h { font-family: Arial, Helvetica, sans-serif; font-weight:700; fill:#11254b; }
      .t { font-family: Arial, Helvetica, sans-serif; font-size:20px; fill:#172b4d; }
      .s { font-family: Arial, Helvetica, sans-serif; font-size:16px; fill:#334a72; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#334a72; }
      .box { stroke:#466899; stroke-width:2; rx:15; filter:url(#shadow); }
      .arrow { stroke:#172b4d; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .thin { stroke:#172b4d; stroke-width:2.4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="2400" height="1400" fill="url(#bg)"/>
  <text x="1200" y="82" font-size="62" text-anchor="middle" class="title">LiteRS-Mamba</text>
  <text x="1200" y="117" font-size="22" text-anchor="middle" class="t">Exact architecture corresponding to MLC_BD_Phase2_LiteRS_Mamba_Pipeline.ipynb</text>

  <!-- TOP LEVEL PIPELINE -->
  <text x="55" y="170" font-size="25" class="h">Input</text>
  <g filter="url(#shadow)">
    <rect x="48" y="192" width="125" height="125" rx="13" fill="#1c6585"/>
    <path d="M61 221 L102 202 L154 218 L116 242 Z" fill="#64a8b5"/><path d="M57 278 L116 242 L162 259 L111 300 Z" fill="#296d61"/>
    <path d="M61 221 L57 278 L111 300 L116 242 Z" fill="#1b5b50"/><path d="M116 242 L162 259 L154 218 Z" fill="#a7bd75"/>
  </g>
  <text x="111" y="347" text-anchor="middle" class="t">B × 3 × 224 × 224</text>
  <path d="M180 255 H220" class="arrow"/>

  <!-- Multi-scale stem -->
  <rect x="224" y="150" width="475" height="300" rx="20" fill="#eff9ff" stroke="#4e9cd5" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="462" y="187" text-anchor="middle" font-size="26" class="h">MultiScaleStem</text>
  <text x="462" y="214" text-anchor="middle" class="s">Hierarchical 3×3 + 5×5 Conv Tokenizer</text>
  <rect x="250" y="240" width="170" height="66" class="box" fill="url(#stem)"/>
  <text x="335" y="268" text-anchor="middle" class="h" font-size="18">3×3 branch ×2</text><text x="335" y="291" text-anchor="middle" class="s">s=2 · BN · SiLU</text>
  <rect x="250" y="338" width="170" height="66" class="box" fill="url(#stem)"/>
  <text x="335" y="366" text-anchor="middle" class="h" font-size="18">5×5 branch ×2</text><text x="335" y="389" text-anchor="middle" class="s">s=2 · BN · SiLU</text>
  <path d="M420 273 H450 M420 371 H450" class="thin"/>
  <rect x="456" y="276" width="103" height="70" class="box" fill="#d9f1ff"/>
  <text x="507" y="305" text-anchor="middle" class="h" font-size="17">Concat</text><text x="507" y="327" text-anchor="middle" class="tiny">128 × 56 × 56</text>
  <path d="M559 311 H578" class="thin"/>
  <rect x="584" y="247" width="91" height="128" class="box" fill="#c4e7ff"/>
  <text x="630" y="278" text-anchor="middle" class="h" font-size="16">1×1 Conv</text><text x="630" y="299" text-anchor="middle" class="tiny">BN · SiLU</text>
  <line x1="598" y1="316" x2="663" y2="316" stroke="#6b9abd"/>
  <text x="630" y="344" text-anchor="middle" class="h" font-size="16">4×4 Conv</text><text x="630" y="365" text-anchor="middle" class="tiny">s=4 · BN · SiLU</text>
  <path d="M699 311 H740" class="arrow"/>

  <!-- flatten and pos embedding -->
  <rect x="745" y="236" width="150" height="150" class="box" fill="#e8ecff"/>
  <text x="820" y="273" text-anchor="middle" class="h" font-size="18">Flatten +</text><text x="820" y="296" text-anchor="middle" class="h" font-size="18">Transpose</text>
  <text x="820" y="326" text-anchor="middle" class="s">B×192×14×14</text><text x="820" y="348" text-anchor="middle" class="s">→ B×196×192</text>
  <rect x="754" y="150" width="132" height="57" rx="12" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="820" y="174" text-anchor="middle" class="h" font-size="15">Learnable</text><text x="820" y="194" text-anchor="middle" class="tiny">Positional Embedding</text>
  <path d="M820 207 V232" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrowPurple)"/>
  <path d="M895 311 H930" class="arrow"/>

  <!-- six blocks -->
  <rect x="930" y="150" width="800" height="300" rx="20" fill="#f8f1ff" stroke="#9b5cff" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="1330" y="188" text-anchor="middle" font-size="26" class="h">6 Sequential FastOmniSSM Blocks</text>
  <text x="1330" y="216" text-anchor="middle" class="s">d_model = 192 · d_state = 16 · expand = 2 (d_inner = 384)</text>
  <g>
    <rect x="960" y="265" width="103" height="105" class="box" fill="#bdebd5"/><rect x="1081" y="265" width="103" height="105" class="box" fill="#c9d9ff"/>
    <rect x="1202" y="265" width="103" height="105" class="box" fill="#b6caff"/><rect x="1323" y="265" width="103" height="105" class="box" fill="#dbc2ff"/>
    <rect x="1444" y="265" width="103" height="105" class="box" fill="#f1c5f5"/><rect x="1565" y="265" width="135" height="105" class="box" fill="#ffc5cb"/>
    <text x="1012" y="305" text-anchor="middle" class="h" font-size="17">Block 1</text><text x="1012" y="330" text-anchor="middle" class="tiny">FastOmniSSM</text>
    <text x="1132" y="305" text-anchor="middle" class="h" font-size="17">Block 2</text><text x="1132" y="330" text-anchor="middle" class="tiny">FastOmniSSM</text>
    <text x="1253" y="305" text-anchor="middle" class="h" font-size="17">Block 3</text><text x="1253" y="330" text-anchor="middle" class="tiny">FastOmniSSM</text>
    <text x="1374" y="305" text-anchor="middle" class="h" font-size="17">Block 4</text><text x="1374" y="330" text-anchor="middle" class="tiny">FastOmniSSM</text>
    <text x="1495" y="305" text-anchor="middle" class="h" font-size="17">Block 5</text><text x="1495" y="330" text-anchor="middle" class="tiny">FastOmniSSM</text>
    <text x="1632" y="305" text-anchor="middle" class="h" font-size="17">Block 6</text><text x="1632" y="330" text-anchor="middle" class="tiny">FastOmniSSM</text>
    <path d="M1063 318 H1078 M1184 318 H1199 M1305 318 H1320 M1426 318 H1441 M1547 318 H1562" class="thin"/>
  </g>
  <path d="M1730 311 H1762" class="arrow"/>

  <!-- classifier -->
  <rect x="1768" y="236" width="100" height="150" class="box" fill="#e9f1ff"/>
  <text x="1818" y="283" text-anchor="middle" class="h" font-size="19">LayerNorm</text><text x="1818" y="311" text-anchor="middle" class="s">192</text>
  <path d="M1868 311 H1890" class="arrow"/>
  <rect x="1896" y="236" width="106" height="150" class="box" fill="#d9efff"/>
  <text x="1949" y="282" text-anchor="middle" class="h" font-size="19">Token Mean</text><text x="1949" y="308" text-anchor="middle" class="s">over 196</text><text x="1949" y="334" text-anchor="middle" class="s">(GAP)</text>
  <path d="M2002 311 H2026" class="arrow"/>
  <rect x="2032" y="236" width="110" height="150" class="box" fill="#e8f9ea"/>
  <text x="2087" y="280" text-anchor="middle" class="h" font-size="19">Linear</text><text x="2087" y="307" text-anchor="middle" class="s">192 → 7</text><text x="2087" y="334" text-anchor="middle" class="s">Softmax</text>
  <path d="M2142 311 H2162" class="arrow"/>
  <rect x="2168" y="188" width="185" height="248" rx="17" fill="#fff" stroke="#5b9be0" stroke-width="2" filter="url(#shadow)"/>
  <text x="2261" y="222" text-anchor="middle" class="h" font-size="21">Predicted Classes</text>
  <g class="s"><rect x="2187" y="241" width="15" height="15" fill="#58a64a"/><text x="2211" y="255">Agricultural Land</text><rect x="2187" y="268" width="15" height="15" fill="#148bc8"/><text x="2211" y="282">Coastlines</text><rect x="2187" y="295" width="15" height="15" fill="#e84444"/><text x="2211" y="309">Built-up</text><rect x="2187" y="322" width="15" height="15" fill="#87bd36"/><text x="2211" y="336">Grassland</text><rect x="2187" y="349" width="15" height="15" fill="#b47729"/><text x="2211" y="363">Hills</text><rect x="2187" y="376" width="15" height="15" fill="#278e53"/><text x="2211" y="390">Forests</text><rect x="2187" y="403" width="15" height="15" fill="#247dce"/><text x="2211" y="417">Water Bodies</text></g>

  <!-- Detail panel -->
  <rect x="28" y="500" width="2344" height="850" rx="22" fill="#fff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="10 7"/>
  <rect x="50" y="520" width="485" height="52" rx="12" fill="url(#navy)"/>
  <text x="292" y="554" text-anchor="middle" font-size="23" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="700">FastOmniSSM Block — Exact Internal Flow</text>
  <text x="58" y="609" class="t">Input tokens: x ∈ R<tspan baseline-shift="sub" font-size="14">B×196×192</tspan>  (H = W = 14)</text>

  <!-- block entry layers -->
  <rect x="80" y="660" width="165" height="78" class="box" fill="#eaf0ff"/>
  <text x="162" y="695" text-anchor="middle" class="h" font-size="21">LayerNorm</text><text x="162" y="720" text-anchor="middle" class="s">x_norm</text>
  <path d="M245 699 H275" class="arrow"/>
  <rect x="282" y="650" width="183" height="98" class="box" fill="#e6dbff"/>
  <text x="373" y="684" text-anchor="middle" class="h" font-size="20">in_proj</text><text x="373" y="708" text-anchor="middle" class="s">192 → 2 × 384</text><text x="373" y="730" text-anchor="middle" class="tiny">split: x_proj and z</text>
  <path d="M465 699 H495" class="arrow"/>

  <!-- x path -->
  <path d="M495 699 V641 H530" class="arrow"/>
  <text x="493" y="632" text-anchor="end" class="tiny">x_proj</text>
  <rect x="535" y="594" width="190" height="94" class="box" fill="#d7f2ff"/>
  <text x="630" y="628" text-anchor="middle" class="h" font-size="19">Depthwise Conv1D</text><text x="630" y="652" text-anchor="middle" class="s">k = 3 + SiLU</text><text x="630" y="673" text-anchor="middle" class="tiny">B×384×196</text>
  <path d="M725 641 H752" class="arrow"/>
  <rect x="758" y="594" width="139" height="94" class="box" fill="#d7f2ff"/>
  <text x="827" y="628" text-anchor="middle" class="h" font-size="18">Reshape</text><text x="827" y="652" text-anchor="middle" class="s">B×384×14×14</text>
  <path d="M897 641 H930" class="arrow"/>

  <!-- parallel scan box -->
  <rect x="935" y="580" width="705" height="348" rx="18" fill="#faf7ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1287" y="616" text-anchor="middle" class="h" font-size="24">4-Way Parallel Batched Spatial Cross-Scan</text>
  <text x="1287" y="642" text-anchor="middle" class="s">Concatenate streams along batch dimension: 4B × 384 × 196</text>
  <g>
    <rect x="962" y="677" width="145" height="55" rx="11" fill="#d5fae9" stroke="#10a46b" stroke-width="2"/><text x="1034" y="702" text-anchor="middle" class="h" font-size="17">u1: H forward</text><text x="1034" y="721" text-anchor="middle" class="tiny">x_conv</text>
    <rect x="962" y="751" width="145" height="55" rx="11" fill="#daf8e9" stroke="#10a46b" stroke-width="2"/><text x="1034" y="776" text-anchor="middle" class="h" font-size="17">u2: H backward</text><text x="1034" y="795" text-anchor="middle" class="tiny">flip token axis</text>
    <rect x="962" y="825" width="145" height="55" rx="11" fill="#dbe9ff" stroke="#3b82f6" stroke-width="2"/><text x="1034" y="850" text-anchor="middle" class="h" font-size="17">u3: V forward</text><text x="1034" y="869" text-anchor="middle" class="tiny">transpose H↔W</text>
    <rect x="1140" y="677" width="145" height="55" rx="11" fill="#eadbff" stroke="#8b5cf6" stroke-width="2"/><text x="1212" y="702" text-anchor="middle" class="h" font-size="17">u4: V backward</text><text x="1212" y="721" text-anchor="middle" class="tiny">flip vertical stream</text>
    <path d="M1107 704 H1330 M1107 778 H1330 M1107 852 H1330 M1285 704 H1330" class="thin"/>
    <rect x="1337" y="685" width="270" height="176" class="box" fill="#f3e8ff"/>
    <text x="1472" y="719" text-anchor="middle" class="h" font-size="20">parallel_ssm_scan</text><text x="1472" y="746" text-anchor="middle" class="s">Selective State Space Model</text><text x="1472" y="775" text-anchor="middle" class="tiny">x_proj: [dt, B, C]</text><text x="1472" y="798" text-anchor="middle" class="tiny">dt_proj + softplus</text><text x="1472" y="821" text-anchor="middle" class="tiny">A = −exp(A_log), D</text><text x="1472" y="844" text-anchor="middle" class="tiny">vectorized recurrent scan</text>
  </g>

  <!-- reverse, fusion -->
  <path d="M1640 754 H1672" class="arrow"/>
  <rect x="1678" y="686" width="157" height="136" class="box" fill="#eef3ff"/>
  <text x="1756" y="719" text-anchor="middle" class="h" font-size="18">Restore scan</text><text x="1756" y="743" text-anchor="middle" class="h" font-size="18">orientations</text><text x="1756" y="770" text-anchor="middle" class="tiny">flip y2 / y4</text><text x="1756" y="792" text-anchor="middle" class="tiny">transpose y3 / y4</text>
  <path d="M1835 754 H1865" class="arrow"/>
  <rect x="1871" y="677" width="188" height="154" class="box" fill="url(#fusion)"/>
  <text x="1965" y="712" text-anchor="middle" class="h" font-size="20">Directional</text><text x="1965" y="736" text-anchor="middle" class="h" font-size="20">Softmax Fusion</text><text x="1965" y="765" text-anchor="middle" class="tiny">w = softmax(dir_weights)</text><text x="1965" y="788" text-anchor="middle" class="tiny">Σᵢ wᵢ yᵢ</text>

  <!-- gating branch and out proj -->
  <path d="M495 699 V991 H1765" stroke="#a855f7" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="575" y="982" class="tiny" fill="#7c3aed">z branch → SiLU(z)</text>
  <path d="M1965 831 V982 H1770" stroke="#172b4d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="1775" y="942" width="174" height="80" class="box" fill="#fff0c9"/>
  <text x="1862" y="974" text-anchor="middle" class="h" font-size="20">Gated product</text><text x="1862" y="1000" text-anchor="middle" class="s">y ⊙ SiLU(z)</text>
  <path d="M1949 982 H1983" class="arrow"/>
  <rect x="1989" y="942" width="132" height="80" class="box" fill="#d9efff"/>
  <text x="2055" y="974" text-anchor="middle" class="h" font-size="19">out_proj</text><text x="2055" y="1000" text-anchor="middle" class="s">384 → 192</text>
  <path d="M2121 982 H2155" class="arrow"/>
  <circle cx="2185" cy="982" r="28" fill="#fff" stroke="#172b4d" stroke-width="3"/><text x="2185" y="991" text-anchor="middle" font-size="28" class="h">+</text>
  <path d="M162 738 V1090 H2185 V1013" class="arrow"/>
  <text x="1115" y="1120" text-anchor="middle" class="h" font-size="21">Residual connection: out = out_proj(y ⊙ SiLU(z)) + x</text>
  <path d="M2213 982 H2250" class="arrow"/>
  <rect x="2255" y="940" width="95" height="84" class="box" fill="#d7faea"/>
  <text x="2302" y="973" text-anchor="middle" class="h" font-size="17">Output</text><text x="2302" y="995" text-anchor="middle" class="s">B×196×192</text>

  <rect x="70" y="1190" width="2260" height="105" rx="16" fill="#eef6ff" stroke="#98b9e6" stroke-width="1.5"/>
  <text x="104" y="1225" class="h" font-size="19">Implementation notes:</text>
  <text x="104" y="1254" class="s">• The directional fusion is inside every FastOmniSSM block (not a single post-backbone fusion layer).   • The classifier is LayerNorm → mean over 196 tokens → Linear(192, 7).</text>
  <text x="104" y="1281" class="s">• “H/V” streams follow the actual code: flatten sequence, reversed flatten sequence, H–W transpose + flatten, and reversed vertical stream. All four streams share one parallel batched SSM scan.</text>
</svg>
